# Automatic backend deployment — Render (no GitHub EC2 SSH secrets)
#
# This repository's historical automatic production deploy path is Render Blueprint.
# Render watches `main` and deploys on each commit (`autoDeployTrigger: commit`).
# No GitHub Actions secrets (EC2_HOST / SSH keys) are required for this path.
#
# The GitHub Actions "Backend Deploy" SSH-to-EC2 workflow was introduced on
# 2026-07-12 (commit 55e1e58) and has been removed so it is not a competing
# production deployment path.
#
# EC2 host 13.207.17.117 is a separate Git checkout and was never driven by
# GitHub Actions auto-deploy in this repository's history. Updating that host
# requires an on-server git pull + service restart (or a future self-hosted
# runner registered on that machine — not present in prior workflows).
#
# PostgreSQL: set DATABASE_URL in the Render dashboard (do not commit secrets).

services:
  - type: web
    name: agri-clinic-backend
    runtime: python
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz/
    buildCommand: chmod +x build.sh && ./build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py verify_production_db
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --access-logfile -
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER_POSTGRES_HOST_SUFFIX
        value: singapore-postgres.render.com
      - key: DB_SSL_REQUIRE
        value: "false"
      - key: ALLOWED_HOSTS
        value: agri-clinic-backend.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://agri-clinic-backend.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://agri-clinic-frontend.onrender.com
      - key: USE_S3
        value: "false"
      - key: LOG_LEVEL
        value: INFO
