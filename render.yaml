# OBSOLETE for production — AWS EC2 is the production backend.
#
# This Blueprint previously auto-deployed to Render on every `main` commit.
# That path connected to Render Postgres
# (dpg-*.singapore-postgres.render.com) and is no longer the production system.
#
# Production:
#   - Django + Gunicorn on AWS EC2 (13.207.17.117 / configured DNS)
#   - PostgreSQL on the same EC2 (127.0.0.1) via server `.env`
#   - Deploy via scripts/deploy_production.sh and
#     .github/workflows/backend-deploy.yml
#
# Keep this file only as an archived reference. autoDeployTrigger is OFF.
# Do not re-enable unless intentionally running a non-production Render sandbox.
# Do not set production DATABASE_URL to any *.render.com / dpg-* host.

services:
  - type: web
    name: agri-clinic-backend
    runtime: python
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /healthz/
    buildCommand: chmod +x build.sh && ./build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py verify_production_db
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --access-logfile -
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "false"
      - key: USE_S3
        value: "false"
      - key: LOG_LEVEL
        value: INFO
