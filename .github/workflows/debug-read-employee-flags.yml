name: Debug Read Employee Flags
on:
  workflow_dispatch:
    inputs:
      username:
        description: Username to inspect
        required: true
        default: KAC-KAVYA01
jobs:
  read:
    name: Read-only EC2 inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect employee flags
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          TARGET_USER: ${{ github.event.inputs.username }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             echo DEPLOYED_SHA=\$(git rev-parse HEAD)
             source .venv/bin/activate
             TARGET_USER='${TARGET_USER}' python - <<'PY'
import os
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
import django
django.setup()
from django.contrib.auth.models import User
from accounts.models import EmployeeProfile
from django.db.models import Q
uname = os.environ.get('TARGET_USER', 'KAC-KAVYA01')
print('TARGET', uname)
print('USERS_IEXACT', list(User.objects.filter(username__iexact=uname).values('id','username','is_active','is_staff','is_superuser','first_name','last_name')))
print('USERS_KAVYA', list(User.objects.filter(username__icontains='KAVYA').values('id','username','is_active','is_staff','is_superuser')))
print('PROFILES', list(EmployeeProfile.objects.filter(Q(employee_id__icontains='KAVYA') | Q(user__username__icontains='KAVYA') | Q(employee_id__iexact='KAC-0001')).values('id','employee_id','is_active_employee','can_login','user_id','user__username','user__is_active','user__is_staff','user__is_superuser')))
u = User.objects.filter(username__iexact=uname).select_related('employee_profile').first()
if not u:
    print('RESOLVE', None)
else:
    p = getattr(u, 'employee_profile', None)
    print('RESOLVE', {
        'user_id': u.id,
        'username': u.username,
        'is_active': u.is_active,
        'is_staff': u.is_staff,
        'is_superuser': u.is_superuser,
        'profile_id': getattr(p, 'id', None),
        'employee_id': getattr(p, 'employee_id', None),
        'is_active_employee': getattr(p, 'is_active_employee', None),
        'can_login': getattr(p, 'can_login', None),
        'mobile_ok': bool(p and p.can_login and p.is_active_employee and u.is_active and not u.is_staff),
    })
    # Which inactive condition would fire
    if not u.is_active:
        print('INACTIVE_REASON', 'User.is_active=False')
    elif p is None:
        print('INACTIVE_REASON', 'EMPLOYEE_PROFILE_MISSING')
    elif not p.is_active_employee:
        print('INACTIVE_REASON', 'EmployeeProfile.is_active_employee=False')
    elif not p.can_login:
        print('INACTIVE_REASON', 'EmployeeProfile.can_login=False')
    elif u.is_staff:
        print('INACTIVE_REASON', 'User.is_staff=True')
    else:
        print('INACTIVE_REASON', 'NONE_mobile_login_should_work_if_password_ok')
print('READ_ONLY_DONE')
PY"