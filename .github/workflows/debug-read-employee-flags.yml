name: Debug Read Employee Flags
on:
  workflow_dispatch:
    inputs:
      username:
        description: Username to inspect
        required: true
        default: KAC-KAVYA01
jobs:
  read:
    name: Read-only EC2 inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect employee flags
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          TARGET_USER: ${{ github.event.inputs.username }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             echo DEPLOYED_SHA=\$(git rev-parse HEAD)
             source .venv/bin/activate
             export TARGET_USER='${TARGET_USER}'
             python -c 'import os; os.environ.setdefault(\"DJANGO_SETTINGS_MODULE\",\"config.settings\"); import django; django.setup(); from django.contrib.auth.models import User; from accounts.models import EmployeeDeviceSession; u=User.objects.filter(username__iexact=os.environ[\"TARGET_USER\"]).select_related(\"employee_profile\").first();
print(\"TARGET\", os.environ[\"TARGET_USER\"]);
print(\"RESOLVE\", None if not u else {\"user_id\":u.id,\"username\":u.username,\"is_active\":u.is_active,\"profile_id\":u.employee_profile.id,\"employee_id\":u.employee_profile.employee_id,\"is_active_employee\":u.employee_profile.is_active_employee,\"can_login\":u.employee_profile.can_login,\"mobile_ok\":bool(u.employee_profile.can_login and u.employee_profile.is_active_employee and u.is_active and not u.is_staff)});
print(\"ACTIVE_SESSIONS\", 0 if not u else EmployeeDeviceSession.objects.filter(user=u,is_active=True).count());
print(\"READ_ONLY_DONE\")'"