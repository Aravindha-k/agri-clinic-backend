name: Ops Production Operational Reset

# Manual-only destructive reset. Not triggered on push.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact production commit SHA that must already be deployed"
        required: true
        type: string
      confirm_phrase:
        description: "Must equal RESET KAVYA OPERATIONAL DATA"
        required: true
        type: string
      allow_production_reset:
        description: "Type YES to allow destructive production reset"
        required: true
        type: string
      mode:
        description: "probe = SHA+S3+counts only; execute = backup+offsite+reset"
        required: true
        type: choice
        options:
          - probe
          - execute
        default: probe

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  operational-reset:
    name: Production operational reset gates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate dispatch gates
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_PHRASE: ${{ inputs.confirm_phrase }}
          ALLOW: ${{ inputs.allow_production_reset }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          if [ "${MODE}" = "execute" ]; then
            test "${ALLOW}" = "YES"
            test "${CONFIRM_PHRASE}" = "RESET KAVYA OPERATIONAL DATA"
          fi

      - name: Checkout ops script at expected SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Probe production SHA, S3 gate, and counts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             HEAD=\$(git rev-parse HEAD)
             echo \"[ops-reset] PRODUCTION SHA: \${HEAD}\"
             if [ \"\${HEAD}\" != '${EXPECTED_SHA}' ]; then
               echo \"[ops-reset] ERROR: server HEAD \${HEAD} != expected ${EXPECTED_SHA}\" >&2
               exit 1
             fi
             test -f system_settings/management/commands/reset_operational_data.py
             test -f system_settings/operational_reset.py
             if grep -E 'manage\\.py import_business_locations|manage\\.py resolve_backfill_review' \
               .github/workflows/backend-deploy.yml scripts/deploy_production.sh >/dev/null 2>&1; then
               echo '[ops-reset] ERROR: automatic location import still in deploy' >&2
               exit 1
             fi
             echo '[ops-reset] reviewed reset implementation: PASS'
             source .venv/bin/activate
             python manage.py shell -c \"
          import os
          from django.conf import settings
          from system_settings.operational_reset import critical_counts
          bucket = (os.getenv('AWS_STORAGE_BUCKET_NAME') or getattr(settings, 'AWS_STORAGE_BUCKET_NAME', None) or '').strip()
          print('[ops-reset] S3 bucket configured:', 'YES' if bucket else 'NO')
          print('[ops-reset] USE_S3:', getattr(settings, 'USE_S3', False))
          counts = critical_counts()
          print('--- PRE-RESET COUNTS ---')
          for k, v in counts.items():
              print(f'{k}: {v}')
          \""

      - name: Create and verify DB backup on EC2
        if: ${{ inputs.mode == 'execute' }}
        id: backup
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"

          scp -i ~/.ssh/deploy_key \
            -P "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            scripts/production_operational_reset.sh \
            "${EC2_USER}@${EC2_HOST}:${DEPLOY_PATH}/scripts/production_operational_reset.sh"

          OUT="$(ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             chmod +x scripts/production_operational_reset.sh
             export EXPECTED_SHA='${EXPECTED_SHA}'
             export OPS_MODE=backup
             ./scripts/production_operational_reset.sh")"
          echo "$OUT"
          BACKUP_REL="$(echo "$OUT" | awk -F= '/^BACKUP_FILE_PATH=/{print $2}' | tail -n1)"
          test -n "$BACKUP_REL"
          echo "backup_rel=${BACKUP_REL}" >> "$GITHUB_OUTPUT"
          BASENAME="$(basename "$BACKUP_REL")"
          echo "backup_name=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Copy backup off EC2 to runner and encrypt
        if: ${{ inputs.mode == 'execute' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          OPS_BACKUP_ENCRYPTION_KEY: ${{ secrets.OPS_BACKUP_ENCRYPTION_KEY }}
          BACKUP_REL: ${{ steps.backup.outputs.backup_rel }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
        run: |
          set -euo pipefail
          : "${OPS_BACKUP_ENCRYPTION_KEY:?OPS_BACKUP_ENCRYPTION_KEY secret is required for off-server copy}"
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          mkdir -p offsite
          scp -i ~/.ssh/deploy_key \
            -P "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}:${DEPLOY_PATH}/${BACKUP_REL}" \
            "offsite/${BACKUP_NAME}"
          SIZE="$(stat -c%s "offsite/${BACKUP_NAME}")"
          echo "[ops-reset] runner backup bytes: ${SIZE}"
          test "${SIZE}" -ge 100000
          # Encrypt so public-repo artifact cannot expose plaintext DB dump.
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "offsite/${BACKUP_NAME}" \
            -out "offsite/${BACKUP_NAME}.enc" \
            -pass env:OPS_BACKUP_ENCRYPTION_KEY
          ENC_SIZE="$(stat -c%s "offsite/${BACKUP_NAME}.enc")"
          echo "[ops-reset] encrypted offsite bytes: ${ENC_SIZE}"
          test "${ENC_SIZE}" -ge 100000
          # Drop plaintext from runner before artifact upload.
          rm -f "offsite/${BACKUP_NAME}"
          echo "[ops-reset] OFF-SERVER BACKUP (encrypted artifact staged): PASS"
          echo "[ops-reset] OFF-SERVER BACKUP FILE: ${BACKUP_NAME}.enc"

      - name: Upload encrypted off-server backup artifact
        if: ${{ inputs.mode == 'execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-operational-reset-encrypted
          path: offsite/*.enc
          if-no-files-found: error
          retention-days: 14

      - name: Execute reset only after off-server gate
        if: ${{ inputs.mode == 'execute' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_EXECUTE: ${{ inputs.confirm_phrase }}
          ALLOW_PRODUCTION_RESET: ${{ inputs.allow_production_reset }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             export EXPECTED_SHA='${EXPECTED_SHA}'
             export CONFIRM_EXECUTE='${CONFIRM_EXECUTE}'
             export ALLOW_PRODUCTION_RESET='${ALLOW_PRODUCTION_RESET}'
             export OPS_MODE=reset
             ./scripts/production_operational_reset.sh"
