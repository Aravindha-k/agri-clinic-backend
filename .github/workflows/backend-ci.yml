name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Django validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agri_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOW_ALL_ORIGINS: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations (test database)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: bash scripts/run_ci_tests.sh --verbosity 2

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-failure-log
          path: |
            **/test*.log
          if-no-files-found: ignore
