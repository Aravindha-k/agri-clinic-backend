name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Django validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agri_test
      CI: "true"
      GITHUB_ACTIONS: "true"
      CI_TEST_DATABASE_NAME: test_agri_test_${{ github.run_id }}_${{ github.run_attempt }}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOW_ALL_ORIGINS: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations (test database)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: bash scripts/run_ci_tests.sh --verbosity 2

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-failure-log
          path: |
            **/test*.log
          if-no-files-found: ignore

  deploy:
    name: Deploy to AWS EC2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_SSH_PRIVATE_KEY}" ]; then
            echo "EC2_SSH_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          if [ -z "${EC2_KNOWN_HOSTS}" ]; then
            echo "EC2_KNOWN_HOSTS secret is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${DEPLOY_PATH:?BACKEND_DEPLOY_PATH secret is required}"
          : "${SERVICE_NAME:?BACKEND_SERVICE_NAME secret is required}"
          : "${HEALTH_URL:?BACKEND_HEALTH_URL secret is required}"

          PORT="${EC2_PORT:-22}"
          BRANCH="${DEPLOY_BRANCH:-main}"

          echo "SSH deploy host=${EC2_HOST} path=${DEPLOY_PATH} commit=${DEPLOY_COMMIT}"

          # Run this commit's deploy script from a temp file so the worktree stays clean
          # for deploy_production.sh safety checks; the script then fast-forwards the tree.
          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             git fetch origin '${BRANCH}'
             git cat-file -e '${DEPLOY_COMMIT}^{commit}'
             TMP_SCRIPT=\$(mktemp /tmp/agri-deploy-XXXXXX.sh)
             git show '${DEPLOY_COMMIT}:scripts/deploy_production.sh' > \"\$TMP_SCRIPT\"
             chmod +x \"\$TMP_SCRIPT\"
             DEPLOY_COMMIT='${DEPLOY_COMMIT}' \
             DEPLOY_PATH='${DEPLOY_PATH}' \
             SERVICE_NAME='${SERVICE_NAME}' \
             BACKEND_HEALTH_URL='${HEALTH_URL}' \
             DEPLOY_BRANCH='${BRANCH}' \
             bash \"\$TMP_SCRIPT\"
             rm -f \"\$TMP_SCRIPT\""

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          echo "Environment: production"