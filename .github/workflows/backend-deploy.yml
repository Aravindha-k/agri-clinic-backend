name: Backend Deploy

# Automatic AWS EC2 deploy on push to main (plus manual dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${EC2_SSH_PRIVATE_KEY:?EC2_SSH_PRIVATE_KEY secret is required}"

          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          SERVICE_NAME="agri-backend.service"
          HEALTH_URL="http://127.0.0.1:8000/healthz/"

          echo "Deploying commit ${EXPECTED_SHA}"
          echo "Host=${EC2_HOST} path=${DEPLOY_PATH} service=${SERVICE_NAME}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             echo '[deploy] fetching origin/main'
             git fetch origin main
             echo '[deploy] resetting to origin/main (preserves .env, media/, .venv)'
             git checkout main
             git reset --hard origin/main
             DEPLOYED=\$(git rev-parse HEAD)
             echo \"[deploy] HEAD=\${DEPLOYED}\"
             if [ \"\${DEPLOYED}\" != '${EXPECTED_SHA}' ]; then
               echo \"[deploy] ERROR: EC2 HEAD \${DEPLOYED} != github.sha ${EXPECTED_SHA}\" >&2
               exit 1
             fi
             source .venv/bin/activate
             pip install -r requirements.txt
             python manage.py migrate --noinput
             python manage.py collectstatic --noinput
             sudo systemctl restart '${SERVICE_NAME}'
             sudo systemctl is-active --quiet '${SERVICE_NAME}'
             sudo systemctl status '${SERVICE_NAME}' --no-pager | head -n 20
             curl -fsS --retry 10 --retry-delay 3 '${HEALTH_URL}'
             echo
             echo \"[deploy] success commit=\$(git rev-parse HEAD)\""
