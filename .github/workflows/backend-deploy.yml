name: Backend Deploy

# Manual-only until the first successful production deployment is confirmed.
# After that, uncomment the workflow_run trigger block below.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Git commit SHA to deploy (defaults to selected branch HEAD)
        required: false
        type: string
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production

  # Uncomment after one successful manual deployment:
  # workflow_run:
  #   workflows: [Backend CI]
  #   types: [completed]
  #   branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy commit
        id: commit
        run: |
          set -euo pipefail
          INPUT_SHA="${{ github.event.inputs.commit_sha }}"
          if [ -n "$INPUT_SHA" ]; then
            git cat-file -e "${INPUT_SHA}^{commit}" || {
              echo "Commit not found in repository: ${INPUT_SHA}" >&2
              exit 1
            }
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploy commit: $(cat "$GITHUB_OUTPUT" | grep '^sha=' | cut -d= -f2-)"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${DEPLOY_PATH:?BACKEND_DEPLOY_PATH secret is required}"
          : "${SERVICE_NAME:?BACKEND_SERVICE_NAME secret is required}"
          : "${HEALTH_URL:?BACKEND_HEALTH_URL secret is required}"

          PORT="${EC2_PORT:-22}"
          BRANCH="${DEPLOY_BRANCH:-main}"

          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_COMMIT='${DEPLOY_COMMIT}' \
             DEPLOY_PATH='${DEPLOY_PATH}' \
             SERVICE_NAME='${SERVICE_NAME}' \
             BACKEND_HEALTH_URL='${HEALTH_URL}' \
             DEPLOY_BRANCH='${BRANCH}' \
             bash '${DEPLOY_PATH}/scripts/deploy_production.sh'"

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployed commit: ${{ steps.commit.outputs.sha }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

