name: Debug Read Media
on:
  workflow_dispatch:
jobs:
  read:
    name: Read-only media inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production media
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/inspect_media.py <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from pathlib import Path
          from django.conf import settings
          from django.core.files.storage import default_storage
          from visits.models import VisitMedia, VisitAttachment
          from masters.models import Farmer
          from accounts.models import EmployeeProfile
          print("USE_S3", getattr(settings, "USE_S3", None))
          print("DEBUG", settings.DEBUG)
          print("SECURE_SSL_REDIRECT", settings.SECURE_SSL_REDIRECT)
          print("SECURE_PROXY_SSL_HEADER", settings.SECURE_PROXY_SSL_HEADER)
          print("USE_X_FORWARDED_HOST", settings.USE_X_FORWARDED_HOST)
          print("MEDIA_ROOT", settings.MEDIA_ROOT)
          print("MEDIA_URL", settings.MEDIA_URL)
          print("DEFAULT_FILE_STORAGE", getattr(settings, "DEFAULT_FILE_STORAGE", None))
          print("ALLOWED_HOSTS", list(settings.ALLOWED_HOSTS))
          mr = Path(settings.MEDIA_ROOT)
          print("MEDIA_ROOT_EXISTS", mr.exists())
          print("MEDIA_ROOT_LIST", [p.name for p in mr.iterdir()] if mr.exists() else None)
          print("VisitMedia_count", VisitMedia.objects.count())
          print("VisitAttachment_count", VisitAttachment.objects.count())
          rows = list(VisitMedia.objects.order_by("-id")[:8].values("id", "visit_id", "media_type", "file", "mime_type", "file_size", "original_filename"))
          print("VisitMedia_latest", rows)
          atts = list(VisitAttachment.objects.order_by("-id")[:8].values("id", "visit_id", "attachment_type", "file", "mime_type", "file_size", "original_filename"))
          print("VisitAttachment_latest", atts)
          farmers = list(Farmer.objects.exclude(profile_photo="").exclude(profile_photo__isnull=True).order_by("-id")[:5].values("id", "name", "profile_photo"))
          print("Farmer_photos", farmers)
          emps = list(EmployeeProfile.objects.exclude(profile_photo="").exclude(profile_photo__isnull=True).order_by("-id")[:5].values("id", "employee_id", "profile_photo"))
          print("Employee_photos", emps)
          items = [("vm", r["file"]) for r in rows] + [("va", a["file"]) for a in atts] + [("fp", f["profile_photo"]) for f in farmers] + [("ep", e["profile_photo"]) for e in emps]
          for label, name in items:
              if not name:
                  continue
              exists = default_storage.exists(name)
              try:
                  size = default_storage.size(name) if exists else None
              except Exception as exc:
                  size = str(exc)
              disk = mr / name
              print("FILE", label, name, "storage_exists", exists, "storage_size", size, "disk_exists", disk.exists(), "disk_size", disk.stat().st_size if disk.exists() else None)
          print("READ_ONLY_DONE")
          PY
          sed -i 's/^          //' /tmp/inspect_media.py
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            /tmp/inspect_media.py "${EC2_USER}@${EC2_HOST}:/tmp/inspect_media.py"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; echo DEPLOYED_SHA=\$(git rev-parse HEAD); echo '--- nginx files ---'; ls -la /etc/nginx /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true; echo '--- nginx grep ---'; (sudo -n grep -n -R -E 'location /media|X-Forwarded-Proto|proxy_set_header|alias ' /etc/nginx /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d || true) 2>/dev/null | head -n 120; source .venv/bin/activate; PYTHONPATH='${DEPLOY_PATH}' python /tmp/inspect_media.py; rm -f /tmp/inspect_media.py"
