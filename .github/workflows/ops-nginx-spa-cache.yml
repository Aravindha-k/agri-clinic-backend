name: Ops Nginx SPA Cache Fix

# Manual. Audits then updates Nginx Cache-Control for Vite Admin SPA.
# Does not touch Django code, DB, mobile, or Disease category.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (read-only) | apply (edit+reload)"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  nginx-spa-cache:
    name: Nginx SPA cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload and run script on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            scripts/ops_nginx_spa_cache.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/ops_nginx_spa_cache.sh"
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "chmod +x /tmp/ops_nginx_spa_cache.sh && MODE='${MODE}' /tmp/ops_nginx_spa_cache.sh"
