name: Ops Activity Summary Verify

# Manual/one-shot read-only production verification. Does not deploy or mutate data.
on:
  workflow_dispatch:

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify activity-summary on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Read-only activity-summary range verification
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             source .venv/bin/activate
             python - <<'PY'
          import json
          from datetime import date, datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()

          from django.contrib.auth import get_user_model
          from rest_framework.test import APIRequestFactory, force_authenticate

          from api.admin.views import VisitActivitySummaryAPI
          from reports.views import AdminReportSummaryAPI
          from api.admin.views import VisitViewSet

          DAY = date(2026, 10, 5)
          MONTH_START = date(2026, 10, 1)

          print('HEAD=', os.popen('git rev-parse HEAD').read().strip())
          print('LOCAL_TODAY=', datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat())

          with urlopen('http://127.0.0.1:8000/healthz/', timeout=20) as r:
              print('HEALTH_STATUS=', r.status)
              print('HEALTH_BODY=', r.read().decode())

          User = get_user_model()
          admin = (
              User.objects.filter(is_staff=True, is_active=True, is_superuser=True)
              .order_by('id')
              .first()
              or User.objects.filter(is_staff=True, is_active=True).order_by('id').first()
          )
          assert admin is not None
          print('ADMIN_USER_ID=', admin.pk)

          factory = APIRequestFactory()

          def call_summary(params):
              req = factory.get('/api/v1/admin/visits/activity-summary/', params)
              force_authenticate(req, user=admin)
              resp = VisitActivitySummaryAPI.as_view()(req)
              resp.render()
              body = json.loads(resp.content.decode())
              return resp.status_code, body

          def payload(body):
              return body.get('data') if isinstance(body.get('data'), dict) else body

          # 4) Legacy date
          st, body = call_summary({'date': DAY.isoformat()})
          print('LEGACY_STATUS=', st)
          assert st == 200, body
          legacy = payload(body)
          print('LEGACY_DATE=', legacy.get('date'))
          print('LEGACY_TOTAL=', legacy.get('total_visits'))
          print('LEGACY_ACTIVE=', legacy.get('active_staff'))
          print('LEGACY_NO_VISITS=', legacy.get('no_visits'))
          print('LEGACY_GPS=', legacy.get('gps_verified'))
          legacy_emps = legacy.get('employees') or []
          print('LEGACY_EMPLOYEES_JSON=')
          print(json.dumps(legacy_emps, indent=2, default=str))
          print(
              'LEGACY_MATCHES_REFERENCE_73_8_4_73=',
              legacy.get('total_visits') == 73
              and legacy.get('active_staff') == 8
              and legacy.get('no_visits') == 4
              and legacy.get('gps_verified') == 73,
          )

          # 5) Same-day range
          st, body = call_summary(
              {'start_date': DAY.isoformat(), 'end_date': DAY.isoformat()}
          )
          print('RANGE_TODAY_STATUS=', st)
          assert st == 200, body
          today_range = payload(body)
          print('RANGE_TODAY_START=', today_range.get('start_date'))
          print('RANGE_TODAY_END=', today_range.get('end_date'))
          print('RANGE_TODAY_TOTAL=', today_range.get('total_visits'))
          print('RANGE_TODAY_ACTIVE=', today_range.get('active_staff'))
          print('RANGE_TODAY_NO_VISITS=', today_range.get('no_visits'))
          print('RANGE_TODAY_GPS=', today_range.get('gps_verified'))
          today_emps = today_range.get('employees') or []
          metrics_match = (
              today_range.get('total_visits') == legacy.get('total_visits')
              and today_range.get('active_staff') == legacy.get('active_staff')
              and today_range.get('no_visits') == legacy.get('no_visits')
              and today_range.get('gps_verified') == legacy.get('gps_verified')
          )
          emp_match = (
              [(e.get('employee_id'), e.get('visit_count')) for e in today_emps]
              == [(e.get('employee_id'), e.get('visit_count')) for e in legacy_emps]
          )
          print('RANGE_EQUALS_LEGACY_METRICS=', metrics_match)
          print('RANGE_EQUALS_LEGACY_EMPLOYEES=', emp_match)
          assert metrics_match and emp_match

          # 6) Week == today on Mon 2026-10-05
          st, body = call_summary(
              {'start_date': DAY.isoformat(), 'end_date': DAY.isoformat()}
          )
          print('WEEK_STATUS=', st)
          assert st == 200
          week = payload(body)
          print('WEEK_TOTAL=', week.get('total_visits'))
          print('WEEK_ACTIVE=', week.get('active_staff'))
          print('WEEK_NO_VISITS=', week.get('no_visits'))
          print('WEEK_GPS=', week.get('gps_verified'))
          print('WEEK_EQUALS_TODAY=', week.get('total_visits') == today_range.get('total_visits'))
          assert week.get('total_visits') == today_range.get('total_visits')

          # 7) Month
          st, body = call_summary(
              {'start_date': MONTH_START.isoformat(), 'end_date': DAY.isoformat()}
          )
          print('MONTH_STATUS=', st)
          assert st == 200, body
          month = payload(body)
          month_emps = month.get('employees') or []
          print('MONTH_START=', month.get('start_date'))
          print('MONTH_END=', month.get('end_date'))
          print('MONTH_TOTAL=', month.get('total_visits'))
          print('MONTH_ACTIVE=', month.get('active_staff'))
          print('MONTH_NO_VISITS=', month.get('no_visits'))
          print('MONTH_GPS=', month.get('gps_verified'))
          print('MONTH_EMPLOYEES_JSON=')
          print(json.dumps(month_emps, indent=2, default=str))
          m_sum = sum(int(e.get('visit_count') or 0) for e in month_emps)
          m_active = sum(1 for e in month_emps if int(e.get('visit_count') or 0) > 0)
          m_zeros = sum(1 for e in month_emps if int(e.get('visit_count') or 0) == 0)
          print('MONTH_CHECK_SUM=', m_sum == int(month.get('total_visits') or 0), m_sum)
          print('MONTH_CHECK_ACTIVE=', m_active == int(month.get('active_staff') or 0), m_active)
          print('MONTH_CHECK_NO_VISITS=', m_zeros == int(month.get('no_visits') or 0), m_zeros)
          assert m_sum == int(month.get('total_visits') or 0)
          assert m_active == int(month.get('active_staff') or 0)
          assert m_zeros == int(month.get('no_visits') or 0)

          # 8) Validation 400s
          cases = {
              'A_START_ONLY': {'start_date': '2026-10-01'},
              'B_END_ONLY': {'end_date': '2026-10-05'},
              'C_START_AFTER_END': {'start_date': '2026-10-06', 'end_date': '2026-10-05'},
              'D_BAD_START': {'start_date': 'bad', 'end_date': '2026-10-05'},
              'E_AMBIGUOUS': {
                  'date': '2026-10-05',
                  'start_date': '2026-10-01',
                  'end_date': '2026-10-05',
              },
          }
          for name, params in cases.items():
              st, body = call_summary(params)
              print('VALIDATION_%s_STATUS=' % name, st)
              assert st == 400, (name, st, body)

          # 9) Smoke existing APIs via viewsets/APIs
          req = factory.get('/api/v1/admin/visits/', {'page_size': 1})
          force_authenticate(req, user=admin)
          view = VisitViewSet.as_view({'get': 'list'})
          resp = view(req)
          resp.render()
          print('ADMIN_VISITS_SMOKE_STATUS=', resp.status_code)
          visits_body = json.loads(resp.content.decode())
          print('ADMIN_VISITS_SMOKE_COUNT=', visits_body.get('count'))
          assert resp.status_code == 200

          req = factory.get(
              '/api/v1/reports/summary/',
              {'from': MONTH_START.isoformat(), 'to': DAY.isoformat()},
          )
          force_authenticate(req, user=admin)
          resp = AdminReportSummaryAPI.as_view()(req)
          resp.render()
          print('REPORTS_SMOKE_STATUS=', resp.status_code)
          assert resp.status_code == 200
          reports_body = json.loads(resp.content.decode())
          rdata = reports_body.get('data') if isinstance(reports_body.get('data'), dict) else reports_body
          print('REPORTS_SMOKE_VISITS=', (rdata or {}).get('totals', {}).get('visits'))
          print('VERIFY_OK=1')
          PY"
