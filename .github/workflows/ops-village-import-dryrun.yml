name: Ops Village Import Dry-Run

# Manual-only. Dry-run against production DB. Never uses --execute.
# Does not deploy. Overlays importer files temporarily, then restores via git.
on:
  workflow_dispatch:
    inputs:
      confirm_dry_run:
        description: "Type DRY-RUN-ONLY to proceed"
        required: true
        type: string

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  village-import-dryrun:
    name: Production village import dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: inputs.confirm_dry_run == 'DRY-RUN-ONLY'

    steps:
      - name: Checkout importer sources
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload workbook + importer overlay
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="/var/www/agri-backend/agri-clinic-backend"
          REMOTE_TMP="/tmp/village_import_dryrun_${GITHUB_RUN_ID}"
          WORKBOOK="imports/Village visit app(2).xlsx"
          test -f "${WORKBOOK}"
          test -f "masters/operational_village_import.py"
          test -f "masters/management/commands/import_operational_villages.py"
          test -f "scripts/village_import_before_counts.py"
          test -f "scripts/village_import_after_counts.py"

          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${REMOTE_TMP}'"

          scp -i ~/.ssh/deploy_key -P "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${WORKBOOK}" \
            "masters/operational_village_import.py" \
            "masters/management/commands/import_operational_villages.py" \
            "scripts/village_import_before_counts.py" \
            "scripts/village_import_after_counts.py" \
            "${EC2_USER}@${EC2_HOST}:${REMOTE_TMP}/"

          echo "REMOTE_TMP=${REMOTE_TMP}" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=${DEPLOY_PATH}" >> "$GITHUB_ENV"
          echo "PORT=${PORT}" >> "$GITHUB_ENV"

      - name: Run production dry-run (zero writes)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             source .venv/bin/activate
             REMOTE_TMP='${REMOTE_TMP}'

             echo '[village-dryrun] PRODUCTION DB CONFIRMATION'
             PYTHONPATH=. python \"\${REMOTE_TMP}/village_import_before_counts.py\"

             mkdir -p masters/management/commands
             cp \"\${REMOTE_TMP}/operational_village_import.py\" masters/operational_village_import.py
             cp \"\${REMOTE_TMP}/import_operational_villages.py\" masters/management/commands/import_operational_villages.py
             XLSX=\"\${REMOTE_TMP}/Village visit app(2).xlsx\"
             test -f \"\${XLSX}\"

             echo
             echo '[village-dryrun] RUNNING import_operational_villages (NO --execute)'
             set +e
             python manage.py import_operational_villages \"\${XLSX}\"
             DRY_EXIT=\$?
             set -e

             echo
             echo '[village-dryrun] AFTER COUNTS'
             PYTHONPATH=. python \"\${REMOTE_TMP}/village_import_after_counts.py\"

             git checkout -- masters/ 2>/dev/null || true
             rm -f masters/operational_village_import.py
             rm -f masters/management/commands/import_operational_villages.py
             git checkout HEAD -- masters/operational_village_import.py masters/management/commands/import_operational_villages.py 2>/dev/null || true
             rm -rf \"\${REMOTE_TMP}\"

             echo \"[village-dryrun] overlay cleaned; dry-run exit=\${DRY_EXIT}\"
             exit \"\${DRY_EXIT}\"
            "
