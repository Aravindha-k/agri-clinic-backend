name: Ops FO Transport Check

on:
  workflow_dispatch:

# READ-ONLY: determine whether live Field Officer traffic reaches EC2
# over HTTP :80 or HTTPS :443. No config changes; bounded packet sample.

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: FO transport check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Inspect logs + sample traffic on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -euo pipefail
          PORT="${EC2_PORT:-22}"
          ssh -i ~/.ssh/deploy_key \
            -p "${PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== NGINX LOG CONFIG ==='
          sudo nginx -T 2>/dev/null | grep -nE 'log_format|access_log' | head -15
          echo '=== LOG FILES ==='
          sudo ls -la /var/log/nginx/ 2>/dev/null | head -10
          echo '=== RECENT API-LIKE HITS (last 400 lines) ==='
          sudo tail -400 /var/log/nginx/access.log 2>/dev/null | grep -iE 'api/v1|mobile|duty|visit|tracking|attendance' | tail -40
          echo '=== COMBINED 5-MIN WINDOW: log delta + port correlation ==='
          LOG=/var/log/nginx/access.log
          BEFORE=$(sudo wc -l < "$LOG" 2>/dev/null || echo 0)
          echo "log lines before window: $BEFORE"
          # Capture plaintext request lines on :80 AND SYN counts on :443
          # for the SAME 180s window, then diff the access log.
          sudo timeout 180 tcpdump -i any -nn -A \
            'tcp dst port 80 and tcp[((tcp[12:1] >> 2) << 2):4] > 0' 2>/dev/null \
            | grep -aoE '^(GET|POST|PUT|PATCH|DELETE) [^ ]+|[Uu]ser-[Aa]gent: [^$]+' \
            > /tmp/fo-port80.txt &
          CAP80=$!
          sudo timeout 180 tcpdump -i any -nn \
            'tcp[tcpflags] & tcp-syn != 0 and dst port 443' 2>/dev/null \
            | awk '{print $3"->"$5}' > /tmp/fo-port443.txt &
          CAP443=$!
          wait $CAP80 $CAP443
          AFTER=$(sudo wc -l < "$LOG" 2>/dev/null || echo 0)
          echo "log lines after window: $AFTER"
          echo '--- :80 plaintext requests seen ---'
          grep -aE '^(GET|POST|PUT|PATCH|DELETE)' /tmp/fo-port80.txt | sort | uniq -c | head -30
          echo '--- :80 user-agents ---'
          grep -ai 'user-agent' /tmp/fo-port80.txt | sort | uniq -c | head -10
          echo '--- :443 new connections (src->dst) ---'
          wc -l < /tmp/fo-port443.txt
          sort /tmp/fo-port443.txt | awk -F'->' '{print $1}' | sed 's/\.[0-9]*$//' | sort | uniq -c | head -15
          echo '--- FO-app log lines written during the window ---'
          sudo tail -n +$((BEFORE+1)) "$LOG" 2>/dev/null | grep -a 'okhttp' | tail -40
          echo '=== DONE ==='
          REMOTE
